openapi: 3.2.0
info:
  title: gamesync
  version: v1
  description: |
    Api spec for interacting with the Gamesync server
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: System
    description: system level stuff like health checks

  - name: Users
    description: managing users
    kind: nav

  - name: Roles
    description: managing roles
    kind: nav

  - name: Permissions
    description: managing permissions for roles
    parent: Roles
    kind: nav

  - name: Chunk
    description: Upload or download chunk
    kind: nav

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    userID:
      name: userID
      description: Used to identify a user
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0

    roleID:
      name: roleID
      description: Identify role
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0

    repoName:
      name: repoName
      description: Identify repository
      in: path
      required: true
      schema:
        type: string
    branchName:
      name: branchName
      description: Identify branch
      in: path
      required: true
      schema:
        type: string
    chunkHash:
      name: chunkHash
      description: 32 byte chunk blake3 hash, hex encoded
      in: path
      required: true
      schema:
        type: string
        minLength: 64
        maxLength: 64

  schemas:

    ### base models
    _UserID:
      type: object
      properties:
        userID:
          type: integer
          format: int64
      required: [userID]
    _UserName:
      type: object
      properties:
        userName:
          type: string
      required: [userName]

    _RoleID:
      type: object
      properties:
        roleID:
          type: integer
          format: int32
      required: [roleID]
    _RoleName:
      type: object
      properties:
        roleName:
          type: string
      required: [roleName]

    _Perm:
      type: integer
      format: int32
    _PermID:
      type: object
      properties:
        permID:
          $ref: "#/components/schemas/_Perm"
      required: [permID]
    _PermName:
      type: object
      properties:
        permName:
          type: string
      required: [permName]

    _SnapshotFile:
      type: object
      properties:
        chunkHashes:
          type: array
          items: 
            type: string
        hash:
          type: string
        path:
          type: string
      required:
        - chunkHashes
        - hash
        - path

    _Chunk:
      type: string
      format: binary

    ### User schemas
    UserNew:
      $ref: "#/components/schemas/_UserName"
    User:
      allOf:
        - $ref: "#/components/schemas/_UserID"
        - $ref: "#/components/schemas/_UserName"
        - $ref: "#/components/schemas/_RoleID"
    UserNewReturn:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            token:
              type: string
          required: [token]

    ### Role schemas
    RoleNew:
      $ref: "#/components/schemas/_RoleName"
    Role:
      allOf:
        - $ref: "#/components/schemas/_RoleID"
        - $ref: "#/components/schemas/_RoleName"

    ### Permission schemas
    PermWithName:
      allOf:
        - $ref: "#/components/schemas/_PermID"
        - $ref: "#/components/schemas/_PermName"
    PermNameArray:
      type: array
      items: 
        type: string
    PermDiff:
      type: object
      properties:
        add:
          $ref: "#/components/schemas/PermNameArray" 
        remove:
          $ref: "#/components/schemas/PermNameArray" 
      required:
        - add
        - remove

    ### Repo schemas
    Repos:
      type: array
      items:
        type: string

    ### Branch schemas
    Branches:
      type: array
      items:
        type: string

    ### Snapshot Schemas
    SnapshotFiles:
      type: array
      items:
        $ref: "#/components/schemas/_SnapshotFile"
    SnapshotNew:
      type: object
      properties:
        files:
          $ref: "#/components/schemas/SnapshotFiles"

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Get health of server
      operationId: get-health
      tags:
        - System
      security: []
      responses:
        "200": {}


  /users:
    get:
      summary: Get all users
      operationId: get-users
      tags:
        - Users
      responses:
        "401": {}
        "200":
          content: 
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500": {}
    post:
      summary: Create new user
      operationId: post-users
      tags:
        - Users
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserNew"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNewReturn"
        "406": {}
        "409": {}
        "500": {}
  /users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userID"
    get:
      summary: Get info about user
      operationId: get-user
      tags:
        - Users
      responses:
        "401": {}
        "404": {}
        "200":
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500": {}
  /users/{userID}/name:
    parameters:
      - $ref: "#/components/parameters/userID"
    put:
      summary: Change username of user
      operationId: put-user-name
      tags:
        - Users
      responses:
        "401": {}
        "404": {}
        "406": {}
        "409": {}
        "200": {}
        "500": {}
      requestBody:
        content: 
          application/json:
            schema:
              $ref: "#/components/schemas/_UserName"
  /users/{userID}/repos:
    parameters:
      - $ref: "#/components/parameters/userID"
    get:
      summary: Get all repos owned by userID
      operationId: get-user-repos
      tags:
        - Users
      responses:
        "401": {}
        "200":
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Repos"
        "500": {}

  /users/{userID}/repos/{repoName}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/repoName"
    put:
      summary: Create new repo and a default branch "main"
      operationId: put-user-repo
      tags:
        - Users
      responses:
        "401": {}
        "409": {}
        "201": {}
        "500": {}

  /users/{userID}/repos/{repoName}/branches:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/repoName"
    get:
      summary: Get all branches in repo
      operationId: get-user-repo-branches
      tags:
        - Users
      responses:
        "401": {}
        "200": 
          content: 
            application/json:
              schema:
                $ref: "#/components/schemas/Branches"
        "500": {}
  /users/{userID}/repos/{repoName}/branches/{branchName}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/repoName"
      - $ref: "#/components/parameters/branchName"
    put:
      summary: Create new branch in repo
      operationId: put-user-repo-branch
      tags:
        - Users
      responses:
        "401": {}
        "404":
          description: "Repo not found"
        "409": {}
        "201": {}
        "500": {}

  /users/{userID}/repos/{repoName}/branches/{branchName}/snapshots:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/repoName"
      - $ref: "#/components/parameters/branchName"
    post:
      summary: Create new snapshot
      operationId: post-user-repo-branch-snapshot
      tags:
        - Users
      responses:
        "401": {}
        "409": {}
        "201": {}
        "500": {}
      requestBody:
        content: 
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotNew"




  /roles:
    get:
      summary: Get all roles
      operationId: get-roles
      tags:
        - Roles
      responses:
        "401": {}
        "200": 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "500": {}
    post:
      summary: Create new role
      operationId: post-roles
      tags:
        - Roles
      responses:
        "401": {}
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "406": {}
        "409": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleNew"


  /roles/{roleID}/name:
    parameters:
      - $ref: "#/components/parameters/roleID"
    put:
      summary: Update role name
      operationId: put-role-name
      tags:
        - Roles
      responses:
        "401": {}
        "200": {}
        "404": {}
        "406": {}
        "409": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_RoleName"


  /roles/{roleID}/perms:
    parameters:
      - $ref: "#/components/parameters/roleID"
    get:
      summary: Get all permissions the role has
      operationId: get-role-perms
      tags:
        - Permissions
      responses:
        "401": {}
        "404": {}
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermNameArray"
        "500": {}
    patch:
      summary: Patch perms for role
      operationId: patch-role-perms
      tags:
        - Permissions
      responses:
        "401": {}
        "200": {}
        "406": {}
        "422": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermDiff"
    put:
      summary: Set perms for role
      operationId: put-role-perms
      tags:
        - Permissions
      responses:
        "401": {}
        "200": {}
        "406": {}
        "422": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermNameArray"
  /perms:
    get:
      summary: Get all available permissions
      operationId: get-perms
      tags:
        - Permissions
      responses:
        "401": {}
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermWithName"
        "500": {}

  /chunks/{chunkHash}:
    parameters:
      - $ref: "#/components/parameters/chunkHash"
    put:
      summary: Upload chunk
      operationId: put-chunk
      tags:
        - Chunk
      requestBody:
        required: true
        content:
          application/octet-stream:
            $ref: "#/components/schemas/_Chunk"
      responses:
        "401": {}
        "201": {}
        "200":
          description: Chunk already exists
        "406": {}
        "413":
          description: Chunk too big
        "422":
          description: Generated file hash does not match chunkHash
        "500": {}

