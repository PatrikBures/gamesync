openapi: 3.2.0
info:
  title: gamesync
  version: v1
  description: |
    Api spec for interacting with the Gamesync server
servers:
  - url: /api/v1
tags:
  - name: Other
  - name: Users
  - name: Roles
  - name: Perms
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    userId:
      name: userId
      description: Used to identify a user
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0

    roleId:
      name: roleId
      description: Identify role
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 0
  schemas:

    ### User schemas
    UserNew:
      type: object
      properties:
        userName:
          type: string
        roleId:
          type: integer
          format: int32
      required:
        - userName
        - roleId
    UserNewReturn:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        userName:
          type: string
        roleId:
          type: integer
          format: int32
        token:
          type: string
      required:
        - userId
        - userName
        - roleId
        - token


    ### Role schemas
    RoleNew:
      type: object
      properties:
        roleName:
          type: string
      required:
        - roleName
    Role:
      type: object
      properties:
        roleName:
          type: string
        roleId:
          type: integer
          format: int32
      required:
        - roleName
        - roleId

    ### Permission schemas
    Perm:
      type: integer
      format: int32
    PermArray:
      type: array
      items: 
        $ref: "#/components/schemas/Perm"
    PermDiff:
      type: object
      properties:
        add:
          $ref: "#/components/schemas/PermArray" 
        remove:
          $ref: "#/components/schemas/PermArray" 
      required:
        - add
        - remove


security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Get health of server
      operationId: get-health
      tags:
        - Other
      security: []
      responses:
        "200": {}
  /users:
    get:
      summary: Get all users
      operationId: get-users
      tags:
        - Users
      responses:
        "200":
          content: 
            application/json:
              schema:
                type: array
        "500": {}
    post:
      summary: Create new user
      operationId: post-users
      tags:
        - Users
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserNew"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNewReturn"
        "406": {}
        "409": {}
        "500": {}
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      summary: Get info about user
      operationId: get-user-id
      tags:
        - Users
      responses:
        "200": {}

  /roles:
    get:
      summary: Get all roles
      operationId: get-roles
      tags:
        - Roles
      responses:
        "200": 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "500": {}
    post:
      summary: Create new role
      operationId: post-roles
      tags:
        - Roles
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "406": {}
        "409": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleNew"



  /roles/{roleId}/perms:
    parameters:
      - $ref: "#/components/parameters/roleId"
    get:
      summary: Get all permissions the role has
      operationId: get-role-perms
      tags:
        - Perms
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermArray"

        "500": {}
    patch:
      summary: Patch perms for role
      operationId: patch-role-perms
      tags:
        - Perms
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermArray"
        "406": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermDiff"
    put:
      summary: Set perms for role
      operationId: put-role-perms
      tags:
        - Perms
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermArray"
        "406": {}
        "500": {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermArray"


