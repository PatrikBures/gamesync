stages:
  - release

variables:
  VERSION:

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        VERSION: "$CI_COMMIT_TAG"
    - when: always

include:
  - local: 'ci/common.yml'

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $VERSION
  extends:
    - .glab
  script:
    - echo "Creating release for $VERSION"
    - glab release delete $VERSION -y || true
    - |
      glab release create "$VERSION" \
      --ref "$CI_COMMIT_SHA" \
      --notes "Version release \
      --name "Release $VERSION"
