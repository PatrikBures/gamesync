services:
  gamesync:
    build: .
    container_name: gamesync
    ports:
      - "8080:8080"
    environment:
      GAMESYNC_DB_PRIMARY_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      GAMESYNC_DB_TYPE: postgres
      GAMESYNC_DB_LOG_LEVEL: error
      GAMESYNC_LOG_REQUESTS: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - gamesync_data:/var/lib/gamesync
    develop:
      watch:
        - path: "./"
          include: "**/*.go"
          action: rebuild
        - path: "./go.mod"
          action: rebuild
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 5s
      retries: 3
  migrate:
    build:
      dockerfile: docker/goose_postgres.Dockerfile
      context: .
    environment:
      GOOSE_DBSTRING: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
    command: ["goose", "up"]
    depends_on:
      db:
        condition: service_healthy
  swagger:
    image: swaggerapi/swagger-ui:latest
    ports:
      - 8081:8080
    environment:
      SWAGGER_JSON: /api/openapi.yml
    volumes:
      - ./api:/api

volumes:
  db:
  gamesync_data:
