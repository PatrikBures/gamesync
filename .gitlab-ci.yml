stages:
  - build util
  - check
  - lint

variables:
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/mod"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
  IMAGE_GIT: $CI_REGISTRY_IMAGE/git:latest

.buildah setup:
  image: quay.io/buildah/stable
  before_script:
    - export STORAGE_DRIVER=vfs
    - export BUILDAH_FORMAT=docker
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

build git image:
  stage: build util
  extends: .buildah setup
  script: 
    - | 
      buildah build \
      -t "$IMAGE_GIT" \
      -f ./docker/git.Dockerfile \
      .
    - buildah push "$IMAGE_GIT"
  rules:
    - changes: 
      - docker/git.Dockerfile
      - .gitlab-ci.yml


# ---
# GIT check
# ---
check gitignore:
  stage: check
  image: $IMAGE_GIT
  script:
    - ./scripts/git-verify-ignore.sh
  rules:
    - when: always

check git size diff:
  stage: check
  image: $IMAGE_GIT
  script:
    - git fetch -a
    - |
      ./scripts/git-verify-size.sh \
      remotes/origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME \
      remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  rules:
    - when: always


# ---
# LINTERS
# ---
lint api:
  stage: lint
  image: dshanley/vacuum
  script: vacuum --ext-refs lint --min-score 100 --pipeline-output api/*
  rules:
    - changes: 
      - api/*
      - .gitlab-ci.yml

lint go:
  stage: lint
  image: golangci/golangci-lint
  script: 
    - mkdir -p .cache/{go-build,mod,golangci-lint}
    - golangci-lint run
    - golangci-lint cache status
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/mod
      - .cache/golangci-lint
    when: always
  rules:
    - changes: 
      - "**/*.go"
      - .gitlab-ci.yml
