stages:
  - lint

lint api:
  stage: lint
  image: dshanley/vacuum
  script: vacuum --ext-refs lint -abdq --min-score 80 api/*
  rules:
    - changes: 
      - api/*
      - .gitlab-ci.yml

lint go:
  stage: lint
  image: golangci/golangci-lint
  script: 
    - mkdir -p .cache/{go-build,mod,golangci-lint}
    - ls -1 .cache
    - golangci-lint run
  cache:
    key:
      files:
        - go.mod
        - go.sum
    fallback_keys:
      - main
    paths:
      - .cache/go-build
      - .cache/mod
      - .cache/golangci-lint
    when: always
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/mod"
    GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
  rules:
    - changes: 
      - "**/*.go"
      - .gitlab-ci.yml
