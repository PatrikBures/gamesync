stages:
  - build

build-client:
  stage: build
  image: golang:1.25-alpine
  only:
    - main
  script:
    - cd client
    - go build -o ../gamesync ./cmd/gamesync
  artifacts:
    paths:
      - gamesync
    expire_in: 1 week

build-server:
  stage: build
  image: ghcr.io/chainguard-dev/kaniko:latest
  only:
    - main
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor \
      --context "${CI_PROJECT_DIR}/server" \
      --dockerfile "${CI_PROJECT_DIR}/server/Dockerfile" \
      --destination "${CI_REGISTRY_IMAGE}:latest"n
