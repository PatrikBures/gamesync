stages:
  - test
  - build
  - upload
  - release

variables:
  VERSION: latest
  LINUX_AMD64_BINARY: gamesync-linux-amd64-${VERSION}
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gamesync/${VERSION}"

lint-golang:
  stage: test
  image: golangci/golangci-lint:v2.8-alpine
  
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: 
        - "**/*.go"
        - ".gitlab-ci.yml"

  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go-build
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.golangci-lint

  cache:
    key: 
      files:
        - go.sum
      prefix: lint-client
    paths:
      - .go/pkg/mod
      - .go-build
      - .golangci-lint

  script:
    - golangci-lint run
build-client:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: 
        - "**/*.go"
        - ".gitlab-ci.yml"
  script:
    - go build -o gamesync ./cmd/gamesync
  artifacts:
    paths:
      - gamesync
    expire_in: 15 min
  
build-server-binary:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
  script:
    - go build -o server/gamesync-state ./cmd/gamesync-state
  artifacts:
    paths:
      - server/gamesync-state
    expire_in: 15 min

build-server:
  stage: build
  image: quay.io/buildah/stable:latest
  needs:
    - job: build-server-binary
      artifacts: true
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot

  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - buildah build -t "$CI_REGISTRY_IMAGE:${VERSION}" ./server
    - buildah push "$CI_REGISTRY_IMAGE:${VERSION}"

upload-client:
  stage: upload
  image: curlimages/curl:latest
  needs:
    - job: build-client
      artifacts: true
  script:
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file gamesync "${PACKAGE_REGISTRY_URL}/${LINUX_AMD64_BINARY}"
    - |
      curl --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${VERSION}" || true
    - |
      curl --request DELETE --header "PRIVATE-TOKEN: ${RELEASE_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/${VERSION}" || true

release-client-latest:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: upload-client
  script:
    - export GITLAB_TOKEN=$RELEASE_TOKEN
    - export GITLAB_HOST=$CI_SERVER_URL
    - glab release delete $VERSION -y || true
    - glab api "projects/$CI_PROJECT_ID/repository/tags/$VERSION" -X DELETE || true
    - |
      glab release create "$VERSION" \
      --ref "$CI_COMMIT_SHA" \
      --name "Release $VERSION" \
      --assets-links="[{\"name\":\"${LINUX_AMD64_BINARY}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${LINUX_AMD64_BINARY}\"}]"
