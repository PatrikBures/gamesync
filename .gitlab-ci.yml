stages:
  - build util
  - check
  - lint

variables:
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/mod"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
  IMAGE_GIT: $CI_REGISTRY_IMAGE/git:latest
  IMAGE_GIT_BUILDAH: $CI_REGISTRY_IMAGE/git-buildah


.docker buildkit:
  services:
    - name: moby/buildkit:latest
      alias: buildkit
      entrypoint: [""]
      command: ["buildkitd", "--addr", "tcp://0.0.0.0:1234"]
  before_script:
    - mkdir -p /root/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /root/.docker/config.json

build git image:
  stage: build util
  image: 
    name: moby/buildkit:latest 
    entrypoint: [""]
  extends: .docker buildkit
  script:
    - |
      buildctl --addr tcp://buildkit:1234 build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=./docker/git.Dockerfile \
        --output type=image,name=$IMAGE_GIT,push=true
  rules:
    - changes: 
      - docker/git.Dockerfile
      - .gitlab-ci.yml

.docker buildah:
  image: quay.io/buildah/stable
  before_script:
    - export STORAGE_DRIVER=vfs
    - export BUILDAH_FORMAT=docker
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

build git image buildah:
  stage: build util
  script: 
    - | 
      buildah build \
      -t "$IMAGE_GIT_BUILDAH" \
      -f ./docker/git.Dockerfile \
      .
    - buildah push "$IMAGE_GIT_BUILDAH"
  rules:
    - changes: 
      - docker/git.Dockerfile
      - .gitlab-ci.yml

check gitignore:
  stage: check
  image: $IMAGE_GIT_BUILDAH
  script:
    - apk add --no-cache git
    - ./scripts/git-verify-ignore.sh
  rules:
    - when: always

lint api:
  stage: lint
  image: dshanley/vacuum
  script: vacuum --ext-refs lint --min-score 100 --pipeline-output api/*
  rules:
    - changes: 
      - api/*
      - .gitlab-ci.yml

lint go:
  stage: lint
  image: golangci/golangci-lint
  script: 
    - mkdir -p .cache/{go-build,mod,golangci-lint}
    - golangci-lint run
    - golangci-lint cache status
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/mod
      - .cache/golangci-lint
    when: always
  rules:
    - changes: 
      - "**/*.go"
      - .gitlab-ci.yml
