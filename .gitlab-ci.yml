stages:
  - build

build-client:
  stage: build
  image: golang:1.25-alpine
  only:
    - main
  script:
    - cd client
    - go build -o ../gamesync ./cmd/gamesync
  artifacts:
    paths:
      - gamesync
    expire_in: 1 week

build-server:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - main
  script:
    - cd server
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest