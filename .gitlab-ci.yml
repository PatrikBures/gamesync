stages:
  - lint
  - build-bin
  - prepare-test
  - test
  - build-con
  - release

variables:
  VERSION: latest
  LINUX_AMD64_BINARY: gamesync-linux-amd64-${VERSION}
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/gamesync/${VERSION}"

  CLIENT_TEST_IMAGE_NAME: gamesync-client-test
  CLIENT_TEST_IMAGE: ${CI_REGISTRY_IMAGE}/${CLIENT_TEST_IMAGE_NAME}

  ALPINE_VERSION: 3.23
  GOLANG_VERSION: 1.26

  GOLANG_IMAGE: "golang:${GOLANG_VERSION}-alpine${ALPINE_VERSION}"
  
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.go-build
  GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.golangci-lint

  CGO_ENABLED: 0

.gocache:
  cache:
    key: 
      files:
        - go.sum
      prefix: "go-${CI_JOB_NAME}${CI_NODE_INDEX:+-${CI_NODE_INDEX}}"
    paths:
      - .go/pkg/mod
      - .go-build

.gocache-lint:
  extends: .gocache
  cache:
    paths:
      - .go/pkg/mod
      - .go-build
      - .golangci-lint

.golang-before-merge:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.go"
        - ".gitlab-ci.yml"
        - "ci/*"

.setup-buildah:
  image: quay.io/buildah/stable
  before_script:
    - export STORAGE_DRIVER=vfs
    - export BUILDAH_FORMAT=docker
    - export CLIENT_TEST_IMAGE=${CLIENT_TEST_IMAGE}
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - buildah login -u "$DOCKER_USER" -p "$DOCKER_PASSWORD" $DOCKER_URL

.deploy:
  rules:
    - if: $DEPLOY

.arch-server:
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        DEPLOY: "true"
        VERSION: "latest"

    - if: '$CI_COMMIT_BRANCH == "ci-test"'
      variables:
        DEPLOY: "true"
        VERSION: "test"

    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        DEPLOY: "true"
        VERSION: "$CI_COMMIT_TAG"

    - when: always
    
include:
  - local: 'ci/common.yml'
  - local: 'ci/client.yml'
  - local: 'ci/server.yml'
  - local: 'ci/test.yml'
