build-server-binary:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
  script:
    - go build -o server/gamesync-state ./cmd/gamesync-state
  artifacts:
    paths:
      - server/gamesync-state
    expire_in: 15 min

build-server:
  stage: build
  image: quay.io/buildah/stable:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
  needs:
    - job: build-server-binary
      artifacts: true
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot

  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - buildah build -t "$CI_REGISTRY_IMAGE:${VERSION}" ./server
    - buildah push "$CI_REGISTRY_IMAGE:${VERSION}"
