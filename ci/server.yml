.container:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &server-changes
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - "Dockerfile"
        - ".gitlab-ci.yml"
        - "ci/*"

.container-deploy:
  rules:
    - if: $DEPLOY
      changes: *server-changes

.build-rule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *server-changes
    - if: $DEPLOY
      changes: *server-changes

.arch:
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

build-server-binary:
  stage: build-bin
  image: $GOLANG_IMAGE
  extends: 
    - .build-rule
    - .arch
    - .gocache
    - .golang-before-merge
  before_script:
    - export GOOS=linux
    - export GOARCH=$ARCH
    - mkdir -p bin
  script:
    - go build -o bin/gamesync-state-$ARCH ./cmd/gamesync-state
  artifacts:
    paths:
      - bin/
    expire_in: 15 min

build-server-container:
  stage: build-con
  extends:
    - .container-deploy
    - .setup-buildah
    - .arch
  needs:
    - job: build-server-binary
      artifacts: true
  variables:
    BUILDAH_ISOLATION: chroot

  script:
    - buildah pull "$CI_REGISTRY_IMAGE:latest" || true

    - |
      buildah build \
      --arch $ARCH \
      --build-arg GAMESYNC_STATE_PATH=bin/gamesync-state-$ARCH \
      --layers \
      --cache-from "$CI_REGISTRY_IMAGE" \
      -t "$CI_REGISTRY_IMAGE:${VERSION}-${ARCH}" \
      ./

    - buildah push "$CI_REGISTRY_IMAGE:${VERSION}-${ARCH}"

build-server-container-test:
  stage: prepare-test
  extends:
    - .container
    - .setup-buildah
    - .golang-before-merge
  needs:
    - job: build-server-binary
      artifacts: true
  variables:
    BUILDAH_ISOLATION: chroot
    VERSION: test-job
  artifacts:
    paths:
      - ssh
    expire_in: 15 min

  script:
    - buildah pull "$CI_REGISTRY_IMAGE:latest" || true

    - mkdir -p ssh
    - ssh-keygen -q -C "test-client" -f ssh/key -N ""
    - echo "COPY ssh/key.pub /config/users/test-user" >> Dockerfile
    - echo "RUN chmod 400 /config/users/test-user" >> Dockerfile

    - |
      buildah build \
      --build-arg GAMESYNC_STATE_PATH=bin/gamesync-state-amd64 \
      --layers \
      --cache-from "$CI_REGISTRY_IMAGE" \
      -t "$CI_REGISTRY_IMAGE:${VERSION}" \
      ./

    - buildah push "$CI_REGISTRY_IMAGE:${VERSION}"

.create-manifest-base:
  stage: prepare-test
  image: quay.io/buildah/stable
  extends:
    - .setup-buildah

  variables:
    GIT_STRATEGY: none

  script:
    - buildah manifest create ${CI_REGISTRY_IMAGE}:${VERSION}

    - buildah manifest add ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}-amd64
    - buildah manifest add ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}-arm64

    - buildah manifest push --all --format v2s2 ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}

create-manifest-standard:
  stage: release
  extends: 
    - .create-manifest-base
    - .container-deploy
  needs:
    - job: build-server-container
      artifacts: false
