build-server-binary:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: $DEPLOY
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
        - "ci/*"
  script:
    - export GOOS=linux
    - export GOARCH=$ARCH
    - mkdir -p bin
    - go build -o bin/gamesync-state-$ARCH ./cmd/gamesync-state
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  artifacts:
    paths:
      - bin/
    expire_in: 15 min

build-server:
  stage: build
  image: quay.io/buildah/stable
  rules:
    - if: $DEPLOY
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
        - "ci/*"
  needs:
    - job: build-server-binary
      artifacts: true
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot

  script:
    - mv bin/gamesync-state-$ARCH server/gamesync-state

    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

    - buildah pull "$CI_REGISTRY_IMAGE:latest" || true

    - |
      buildah build \
      --arch $ARCH \
      --layers \
      --cache-from "$CI_REGISTRY_IMAGE" \
      -t "$CI_REGISTRY_IMAGE:${ARCH}" \
      ./server

    - buildah push "$CI_REGISTRY_IMAGE:${ARCH}"

  parallel:
    matrix:
      - ARCH: [amd64, arm64]

create-manifest:
  stage: release
  image: quay.io/buildah/stable
  rules:
    - if: $DEPLOY
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
        - "ci/*"
  needs:
    - job: build-server
      artifacts: false

  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker

  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - buildah manifest create ${CI_REGISTRY_IMAGE}:${VERSION}

    - buildah manifest add ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:amd64
    - buildah manifest add ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:arm64

    - buildah manifest push --all --format v2s2 ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}


cleanup-temp-tags:
  stage: release
  image: 
    name: quay.io/skopeo/stable
    entrypoint: [""]
  rules:
    - if: $DEPLOY
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - ".gitlab-ci.yml"
        - "ci/*"
  needs:
    - job: create-manifest
      artifacts: false
  variables:
    GIT_STRATEGY: none
  script:
    - skopeo login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

    - skopeo delete docker://${CI_REGISTRY_IMAGE}:amd64 || true
    - skopeo delete docker://${CI_REGISTRY_IMAGE}:arm64 || true
