.container:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: 
        - "cmd/gamesync-state/*.go"
        - "server/*"
        - "Dockerfile"
        - ".gitlab-ci.yml"
        - "ci/*"


.arch:
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

build-server-binary:
  stage: prepare-test
  image: $GOLANG_IMAGE
  extends: 
    - .container
    - .arch
    - .gocache
  before_script:
    - export GOOS=linux
    - export GOARCH=$ARCH
    - mkdir -p bin
  script:
    - go build -o bin/gamesync-state-$ARCH ./cmd/gamesync-state
  artifacts:
    paths:
      - bin/
    expire_in: 15 min

build-server-container:
  stage: prepare-test
  extends:
    - .container
    - .setup-buildah
    - .arch
  needs:
    - job: build-server-binary
      artifacts: true
  variables:
    BUILDAH_ISOLATION: chroot

  script:
    - buildah pull "$CI_REGISTRY_IMAGE:latest" || true

    - |
      buildah build \
      --arch $ARCH \
      --build-arg GAMESYNC_STATE_PATH=bin/gamesync-state-$ARCH \
      --layers \
      --cache-from "$CI_REGISTRY_IMAGE" \
      -t "$CI_REGISTRY_IMAGE:${VERSION}-${ARCH}" \
      ./

    - buildah push "$CI_REGISTRY_IMAGE:${VERSION}-${ARCH}"

create-manifest:
  stage: prepare-test
  image: quay.io/buildah/stable
  extends:
    - .container
    - .setup-buildah
  needs:
    - job: build-server-container
      artifacts: false

  variables:
    GIT_STRATEGY: none

  script:
    - buildah manifest create ${CI_REGISTRY_IMAGE}:${VERSION}

    - buildah manifest add ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}-amd64
    - buildah manifest add ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}-arm64

    - buildah manifest push --all --format v2s2 ${CI_REGISTRY_IMAGE}:${VERSION} docker://${CI_REGISTRY_IMAGE}:${VERSION}
