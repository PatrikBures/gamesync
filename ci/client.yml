.client-builds:
  parallel:
    matrix:
      - OS: linux
        ARCH: [amd64, arm64, riscv64, '386']
      - OS: darwin
        ARCH: [amd64, arm64]
  before_script:
    - export BIN_NAME=gamesync-${OS}-${ARCH}-${VERSION}


lint-golang:
  stage: lint
  image: golangci/golangci-lint:v2.8-alpine
  extends:
    - .golang-before-merge
    - .gocache-lint
  script:
    - golangci-lint run

build-client-binary-test:
  stage: build-bin
  image: $GOLANG_IMAGE
  extends: 
    - .golang-before-merge
    - .gocache
  script:
    - mkdir -p bin
    - go build -o ci/client-test/gamesync ./cmd/gamesync
  artifacts:
    paths:
      - ci/client-test/gamesync
    expire_in: 15 min

build-client-container-test:
  stage: prepare-test
  extends:
    - .golang-before-merge
    - .setup-buildah
  needs:
    - job: build-client-binary-test
      artifacts: true
  variables:
    BUILDAH_ISOLATION: chroot

  script:
    - echo "CLIENT_TEST_IMAGE $CLIENT_TEST_IMAGE"
    - echo "CI_REGISTRY_IMAGE $CI_REGISTRY_IMAGE"

    - buildah pull "${CLIENT_TEST_IMAGE}:latest" || true

    - |
      buildah build \
      --build-arg GOLANG_IMAGE=${GOLANG_IMAGE} \
      --layers \
      --cache-from "$CLIENT_TEST_IMAGE" \
      -t "$CLIENT_TEST_IMAGE:latest" \
      ./ci/client-test/

    - buildah push "$CLIENT_TEST_IMAGE:latest"




build-client:
  stage: build-bin
  image: $GOLANG_IMAGE
  extends: 
    - .deploy
    - .client-builds
    - .gocache
  script:
    - export GOOS=$OS
    - export GOARCH=$ARCH
    - mkdir -p bin
    - go build -o bin/${BIN_NAME} ./cmd/gamesync
  artifacts:
    paths:
      - bin/
    expire_in: 15 min

upload-client:
  stage: release
  image: curlimages/curl:latest
  extends:
    - .deploy 
    - .client-builds
  needs:
    - job: build-client
      artifacts: true
  variables:
    GIT_STRATEGY: none
  script:
    - |
      curl \
      --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --upload-file bin/${BIN_NAME} "${PACKAGE_REGISTRY_URL}/${BIN_NAME}"


release-create-client:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  extends:
    - .deploy 
    - .glab
  needs:
    - job: upload-client
  script:
    - glab release delete $VERSION -y || true
    - |
      glab release create "$VERSION" \
      --ref "$CI_COMMIT_SHA" \
      --name "Release $VERSION"

release-assets-client:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  extends:
    - .deploy 
    - .glab
    - .client-builds
  needs:
    - job: release-create-client
  before_script:
    - !reference [.glab, before_script]
    - !reference [.client-builds, before_script]
  script:
    - |
      glab api projects/$CI_PROJECT_ID/releases/${VERSION}/assets/links \
        -F name="${BIN_NAME}" \
        -F url="${PACKAGE_REGISTRY_URL}/${BIN_NAME}"

