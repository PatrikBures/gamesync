test-client-server:
  stage: test
  image: $CLIENT_TEST_IMAGE:latest
  extends:
    - .golang-before-merge
    - .gocache
  services:
    - name: ${CI_REGISTRY_IMAGE}:test-job
      alias: server
  script:
    - mkdir ~/.ssh
    - cp /ssh/key ~/.ssh/key
    - chmod 600 ~/.ssh/key

    - ssh -i ~/.ssh/key test-user@server

    - go mod tidy
    - go test -v ./...
