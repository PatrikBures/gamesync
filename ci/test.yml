test-client-server:
  stage: test
  image: $CLIENT_TEST_IMAGE:latest
  extends:
    - .golang-before-merge
    - .gocache
  variables:
    GAMESYNC_UNRESTRICTED: "true"
  services:
    - name: ${CI_REGISTRY_IMAGE}:test-job
      alias: server
  before_script:
    - mkdir -p ~/.ssh
    - ssh-keyscan -H -t ed25519 server >> ~/.ssh/known_hosts
  script:
    - ssh -i ssh/key test-user@server ls

    - go mod tidy
    - go test -v ./...
