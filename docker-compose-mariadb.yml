services:
  gamesync:
    build: .
    container_name: gamesync
    ports:
      - "8080:8080"
    environment:
      GAMESYNC_DB_URL: "root:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME}"
      GAMESYNC_DB_TYPE: mysql
      GAMESYNC_LOGGING: true
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:12
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 5s
      retries: 3
